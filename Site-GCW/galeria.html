<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Privada - Lima Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <nav class="nav">
        <div class="logo">LIMA <span>STUDIO</span></div>
        <a href="index.html" class="btn">Voltar</a>
    </nav>

    <section class="gallery-page">
        <h1>Galeria Privada</h1>
        <p>Digite sua senha para acessar suas fotos exclusivas.</p>

        <div class="login-box">
            <input type="password" id="senha" placeholder="Digite sua senha">
            <button onclick="acessarGaleria()">Acessar</button>
        </div>

        <div id="galeria" class="hidden gallery-grid">
            <div class="item"><img src="img/IMG_0854.jpg" alt="Imagem 1"></div>
            <div class="item"><img src="img/IMG_0853.jpg" alt="Imagem 2"></div>
            <div class="item"><img src="img/IMG_0852.jpg" alt="Imagem 3"></div>
            <div class="item"><img src="img/IMG_0851.jpg" alt="Imagem 4"></div>
            <div class="item"><img src="img/IMG_0850.jpg" alt="Imagem 5"></div>
            <div class="item"><img src="img/img1.jpg" alt="Imagem 6"></div>
            <div class="item"><img src="img/img2.jpg" alt="Imagem 7"></div>
            <div class="item"><img src="img/img3.jpg" alt="Imagem 8"></div>
            <div class="item"><img src="img/img4.jpg" alt="Imagem 9"></div>
            <div class="item"><img src="img/img5.jpg" alt="Imagem 10"></div>
        </div>
    </section>

    <div class="lightbox-overlay" id="lightboxOverlay" role="dialog" aria-modal="true">
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose" aria-label="Fechar">×</button>
            <img src="" alt="Visualização da imagem" class="lightbox-image" id="lightboxImage">
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
